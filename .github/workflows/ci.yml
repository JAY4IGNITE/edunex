name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: campuspulse_test
          POSTGRES_USER: campuspulse
          POSTGRES_PASSWORD: campuspulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campuspulse -d campuspulse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://campuspulse:campuspulse@127.0.0.1:5432/campuspulse_test
      ENVIRONMENT: development
      EDUNEX_SESSION_SECRET: ci-only-synthetic-session-secret

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies and Ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt ruff

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint changed Python surfaces
        run: >-
          ruff check --isolated --select E4,E7,E9,F
          backend/app/core/config.py
          backend/app/core/database.py
          backend/app/core/access_scope.py
          backend/app/core/demo_auth.py
          backend/app/main.py
          backend/app/api/endpoints/auth.py
          backend/scripts/run_ingestion.py
          backend/tests/test_auth_scope.py
          backend/tests/test_config.py
          backend/tests/test_health.py
          backend/tests/test_ingestion.py

      - name: Migrate and seed isolated synthetic database
        run: |
          alembic -c backend/alembic.ini upgrade head
          python -m backend.scripts.run_ingestion

      - name: Run backend suite
        run: |
          mkdir -p .phase-work/pytest-ci
          python -m pytest backend/tests -q --basetemp=.phase-work/pytest-ci

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test -- --pool=vmThreads --maxWorkers=1

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend for production
        working-directory: frontend
        run: npm run build

      - name: Install Chromium for browser checks
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start API and Vite
        run: |
          nohup python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 > /tmp/edunex-api.log 2>&1 &
          nohup npm --prefix frontend run dev -- --port 5173 > /tmp/edunex-vite.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8000/api/health >/dev/null && curl --silent --fail http://127.0.0.1:5173/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/edunex-api.log
          cat /tmp/edunex-vite.log
          exit 1
        env:
          EDUNEX_API_PROXY_TARGET: http://127.0.0.1:8000

      - name: Verify public landing accessibility
        working-directory: frontend
        run: node scripts/verify-landing.mjs
        env:
          EDUNEX_TEST_BASE_URL: http://127.0.0.1:5173
          EDUNEX_TEST_OUTPUT: ../.phase-work/judge-evidence/landing-accessibility

      - name: Measure public landing with Lighthouse
        working-directory: frontend
        run: >-
          npx --yes lighthouse@13.5.0 http://127.0.0.1:5173/
          --chrome-path="$(node -p 'require("playwright").chromium.executablePath()')"
          --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"
          --only-categories=performance,accessibility,best-practices,seo
          --output=json,html
          --output-path=../.phase-work/judge-evidence/lighthouse
          --quiet

      - name: Run complete judge journey
        working-directory: frontend
        run: npm run test:judge
        env:
          EDUNEX_TEST_BASE_URL: http://127.0.0.1:5173
          EDUNEX_TEST_OUTPUT: ../.phase-work/judge-evidence

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: edunex-judge-evidence
          path: .phase-work/judge-evidence/
          if-no-files-found: warn
