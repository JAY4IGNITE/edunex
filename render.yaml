services:
  - type: web
    name: edunex-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    preDeployCommand: "alembic upgrade head"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: edunex-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: edunex-redis
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: "https://edunex.onrender.com"

  - type: web
    name: edunex
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://edunex-backend.onrender.com"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: edunex-db
    databaseName: edunex
    user: edunex

  - type: redis
    name: edunex-redis
    ipAllowList: []
