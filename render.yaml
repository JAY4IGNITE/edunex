services:
  - type: web
    name: campuspulse-backend
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    preDeployCommand: "alembic upgrade head"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campuspulse-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: "https://campuspulse-frontend.onrender.com"

  - type: web
    name: campuspulse-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://campuspulse-backend.onrender.com"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: campuspulse-db
    databaseName: campuspulse
    user: campuspulse
