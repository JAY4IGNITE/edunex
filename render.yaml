services:
  - type: redis
    name: edunex-redis
    plan: free
    ipAllowList: []

  - type: web
    name: edunex-backend
    env: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    # Free web services do not support pre-deploy commands; migrate and seed before serving.
    startCommand: "alembic -c backend/alembic.ini upgrade head && python -m backend.scripts.run_ingestion && uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: "/api/health"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: edunex-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: edunex-redis
          property: connectionString
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: edunex
          envVarKey: RENDER_EXTERNAL_URL
      - key: ENVIRONMENT
        value: production
      - key: EDUNEX_SESSION_SECRET
        sync: false

  - type: web
    name: edunex
    env: static
    buildCommand: "cd frontend && npm ci && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: edunex-backend
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # Free Postgres expires 30 days after creation and has no backups; use paid for durability.
  - name: edunex-db
    databaseName: edunex
    user: edunex
    plan: free
