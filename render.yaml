services:
  - type: redis
    name: edunex-redis
    plan: free
    ipAllowList: []

  - type: web
    name: edunex-backend
    env: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "alembic -c backend/alembic.ini upgrade head && PYTHONPATH=. python backend/scripts/generate_demo.py && PYTHONPATH=. python backend/scripts/run_ingestion.py && uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: edunex-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: edunex-redis
          property: connectionString
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: edunex
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: edunex
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: edunex-backend
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: edunex-db
    databaseName: edunex
    user: edunex
    plan: free
